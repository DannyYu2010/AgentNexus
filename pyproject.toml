[project]
name = "agent-memory-hub"
version = "0.1.0"
description = "Local shared project-state store for multiple coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.1.1",
    "mem0ai>=2.0.19",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_hub"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
